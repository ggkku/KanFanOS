[package]
name = "kanfanos"
version = "1.2.2"
description = "KanFanOS - 本地视频媒体库"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kanfanos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# unstable：窗口内嵌第二个 WebView2（Window::add_child），用于内置浏览器。
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
anyhow = "1.0.104"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["full"] }
walkdir = "2.5.0"
dunce = "1.0.5"
tauri-plugin-dialog = "2.8.3"
notify = "8.2.0"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
toml = "1.1.8"
# qBittorrent WebUI API；cookie_store 用来保存登录后的 SID。
reqwest = { version = "0.12", features = ["json", "cookies", "gzip", "charset", "system-proxy"] }
# 生成 qBittorrent WebUI 的密码哈希：base64(salt):base64(PBKDF2-HMAC-SHA512)。
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
