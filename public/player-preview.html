<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      .card {
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        overflow: hidden;
        border: 1px solid rgba(115, 115, 115, 0.8);
        border-radius: 8px;
        background: #0a0a0a;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      }
      #image {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img id="image" alt="" />
    </div>
    <script>
      window.setPreview = (source) => {
        if (typeof source === "string" && source) {
          document.getElementById("image").src = source;
        }
      };
    </script>
  </body>
</html>
